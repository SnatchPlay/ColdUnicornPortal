name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint source
        run: pnpm lint

      - name: Run unit and behavior tests
        run: pnpm test:run

      - name: Build production bundle
        run: pnpm build

  # ── Apply pending DB migrations to the cloud project ──────────────────────────────────────────
  # Reuses the same runner as local dev (scripts/db-apply-migrations.mjs), tracking state in
  # private.schema_migrations. Disabled until you set repo variable ENABLE_DB_MIGRATE=true and
  # add the SUPABASE_DB_URL secret (the cloud pooler connection string — never committed).
  db-migrate:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DB_MIGRATE == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  # ── Deploy edge functions to the cloud project ────────────────────────────────────────────────
  # Runs AFTER migrations so function code never lands before the schema it depends on.
  # `supabase functions deploy` applies each function's verify_jwt from supabase/config.toml —
  # CONFIRM those values match production before enabling this job. Disabled until you set repo
  # variable ENABLE_FUNCTION_DEPLOY=true and add the SUPABASE_ACCESS_TOKEN secret.
  deploy-functions:
    needs: [verify, db-migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_FUNCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: |
          supabase functions deploy orm-gateway orm-gateway-next send-invite manage-invites \
            --project-ref bnetnuzxynmdftiadwef

  # ── Deploy the frontend to the self-hosted server ─────────────────────────────────────────────
  # Waits for migrations (success or skipped) and aborts if migrations FAILED, so a new bundle
  # never ships against an un-migrated schema.
  deploy:
    needs: [verify, db-migrate]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.verify.result == 'success'
      && needs.db-migrate.result != 'failure'
      && needs.db-migrate.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/data/portal
            git fetch --all --prune
            # Mirror the remote instead of merging into the server's clone. The checkout is a
            # deploy artefact with no history worth preserving, and `git pull --ff-only` aborts
            # outright whenever main is rewritten (a force-push leaves no common ancestor to
            # fast-forward from), which wedges every deploy until someone SSHes in by hand.
            # `reset --hard` discards local changes on the server — it must not be edited in
            # place. Untracked files (the server's .env, docker volumes) are left alone: no
            # `git clean` here, or a deploy would delete the environment it needs to run.
            git checkout -f main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
