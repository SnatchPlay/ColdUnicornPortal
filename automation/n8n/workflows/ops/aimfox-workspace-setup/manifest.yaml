schemaVersion: 1

id: aimfox-workspace-setup
name: "[SETUP] Aimfox workspace · resolve, key, webhooks, labels"
domain: ops
owner: automation

# `managed` since 2026-08-07: the graph exists as ehhFUR3SYIxDahER and workflow.json is the export.
# The write half landed the same day (iteration 2, 11 nodes -> 21). `status` stays `planned` until
# a real dry_run:false run has been observed end to end; the workflow is still INACTIVE and is
# called by hand. It has no trigger of its own until ADR-0018 gives the gateway its webhook.
lifecycle: managed
status: planned
criticality: high         # mints API keys and creates webhooks in a client's sending system

businessProcess:
  - docs/reference/processes/ops/workspace-provisioning.md

architectureDecisions:
  - docs/adr/0012-multi-sequencer-model.md
  - docs/adr/0016-repository-as-automation-source-of-truth.md

triggers:
  - type: executeWorkflowTrigger
    detail: >-
      The current entry point. Callable as a sub-workflow, and how the five production dry-runs of
      2026-08-07 were made.
  - type: webhook
    detail: >-
      POST /webhook/workspace-setup-aimfox, from the orm-gateway `requestWorkspaceSetup` action.
      UNAUTHENTICATED — see knownViolations. An `Input` node normalises the webhook body and the
      sub-workflow item into one shape and forces dry_run to a boolean.

reads:
  tables:
    - clients
    - sequencers
    - client_sequencers
  external:
    - "Aimfox API · GET /api/v2/workspaces (master key) — the only way to resolve a workspace by name"
    - "Aimfox API · GET /api/v2/workspaces/{id}/tokens (master key) — reuse an existing key rather than minting a second"
    - "Aimfox API · GET /api/v2/webhooks — current webhook set, compared on url + events"
    - "Aimfox API · GET /api/v2/labels — current label set, compared on name"

# Direct table writes, no RPC — confirmed against RPC_OWNED_TABLES in
# scripts/n8n/lib/business-rules.mjs. The ingestion RPC contract of ADR-0015 covers leads, replies,
# ooo_followups and sequencer_contacts; neither table below is one of them, and neither carries a
# business invariant that an RPC would be protecting. The two credential-sync workflows write
# client_sequencers the same way.
writes:
  tables:
    - client_sequencers
    - integration_sync_runs
  tablesWritten:
    - client_sequencers
    - integration_sync_runs
  rpcs: []
  external:
    - "Aimfox API · POST /api/v2/workspaces/{id}/tokens (node: Mint Key) — only when neither the connector row nor the vendor already holds a usable key"
    - "Aimfox API · POST /api/v2/webhooks (node: Create Missing) — only for a url+events pair that is absent"
    - "Aimfox API · POST /api/v2/labels (node: Create Missing) — only for a name that is absent"

# Exactly two nodes issue a POST — Mint Key and Create Missing — and both sit behind a branch that
# a dry run cannot reach. dry_run safety is structural, not a flag inside an HTTP node: Plan Writes
# returns an EMPTY array on a dry run, and n8n does not execute a node with no input items. There is
# nothing to write with, so nothing is written. `dry_run` is also read as true for anything except an
# explicit false — a missing field has to mean "do not touch", never "write into a client's system".

credentials:
  - alias: "Aimfox Master"
    type: httpBearerAuth
    usedBy: "List Workspaces, List Tokens, Mint Key"
  - alias: "Postgres account"
    type: postgres
    usedBy: "Resolve Client, Read Claimed, Record"
  # NOT attached. The Webhook node is unauthenticated as of 2026-08-08 — see knownViolations.
  # The gateway already sends x-automation-secret, so attaching this closes the gap on its own.
  - alias: "Workspace setup webhook auth"
    type: httpHeaderAuth
    planned: true
    usedBy: "Webhook — intended, not attached"

targetContract:
  input: automation/n8n/workflows/ops/aimfox-workspace-setup/contracts/setup-input.schema.json
  output: automation/n8n/workflows/ops/aimfox-workspace-setup/contracts/setup-result.schema.json

portalSurfaces:
  - "Clients page — provisioning status column (client_sequencers.setup_state)"
  - "Client drawer — Workspaces section: Перевірити (dry_run) / Налаштувати"

metrics: []

idempotency:
  key: "(client_id, sequencer_id) for the connector row; url + events for a webhook; name for a label"
  notes: >-
    Every step reads the vendor's current state before it writes and creates only what is absent, so
    a second run is a no-op. This is invariant 3 of the process document and it is not cosmetic: a
    duplicated webhook produces two deliveries per event, which produces two leads. Webhooks are
    matched on url + events and NEVER on name — GIC's lead_label_added webhook is named "Manual Tag",
    and a name match would create a second webhook on the same event.

retryPolicy:
  notes: >-
    No retries. Every vendor call runs with onError continueRegularOutput and contributes its own
    outcome to the `steps` object, so one 4xx yields state `partial` instead of an unexplained stop
    midway. settings.errorWorkflow points at automation-failure-recorder, so a hard failure also
    becomes an integration_sync_runs row.

cancellation:
  notes: >-
    Nothing to cancel — a single synchronous pass. A failure leaves the workspace partially
    provisioned, which is safe precisely because re-running completes it.

environments:
  development:
    remoteWorkflowId: null
  production:
    remoteWorkflowId: ehhFUR3SYIxDahER

knownViolations:
  # `rule` is the validator's finding id, not prose — it is what suppresses the warning. The prose
  # belongs in `reason`, and the ADR clause being broken is ADR-0018 §2.
  - rule: unauthenticated-webhook
    reason: >-
      Breaks ADR-0018 §2 ("header-authenticated from its first day"). Explicit owner decision on
      2026-08-08; the header-auth alternative was offered, costed at two minutes in the n8n UI, and
      declined for now. The gateway ALREADY sends x-automation-secret, so attaching a credential
      later is a one-side change that breaks nothing. Mitigation: the run is idempotent and additive
      against a closed canonical set, never deletes, and cannot be pointed at an arbitrary workspace
      — that comes from client_sequencers or an exact name match, never from the request. No
      credential crosses back (the result contract forbids api_key; the gateway strips
      api_key/token/plain_text_token at its boundary). The Input node treats anything but an
      explicit boolean false as a dry run, so a malformed body cannot write.
    trackedIn: docs/reference/n8n/security.md#11-the-workspace-provisioning-webhooks-are-unauthenticated--medium-open
    expires: 2026-11-30
