schemaVersion: 1

id: sheets-credential-sync-on-edit
name: "[CRED] CS PDCA edit → client_sequencers · Bison + Aimfox keys"
domain: ops
owner: automation
lifecycle: managed
status: active
criticality: high         # writes the credentials every Bison and Aimfox call in the estate reads

businessProcess:
  - docs/reference/processes/outreach/bison-ingestion.md
  - docs/reference/processes/outreach/linkedin-aimfox.md

architectureDecisions:
  - docs/adr/0012-multi-sequencer-model.md
  - docs/adr/0017-sheets-to-supabase-dual-write-transition.md

triggers:
  - type: webhook
    detail: >-
      POST /webhook/credential-sync, from the Google Apps Script `credentialsSync` onEdit trigger on
      the `GHEADS | PDCA` spreadsheet. It fires when an edited range intersects column E (col_5,
      Bison workspace id), F (col_6, Bison API key) or DA (col_105, Aimfox token), and sends ONE
      request per edited sheet row carrying all three values.

reads:
  tables:
    - sequencers
    - client_sequencers
  external:
    - "Google Sheets · CS PDCA — col_5 (Bison workspace id), col_6 (Bison API key), col_105 (Aimfox token), via the webhook payload"
    - "Aimfox API · GET /api/v2/accounts — the only source of accounts[].workspace_id; CS PDCA has no column for it"

writes:
  tables:
    - client_sequencers
  tablesWritten:
    - client_sequencers
  rpcs: []
  external: []

credentials:
  - alias: "Postgres account"
    type: postgres
    usedBy: "Sync client_sequencers"

transition:
  phase: A
  phaseState: live
  authoritativeSource: sheets
  legacyStore: "Google Sheets · CS PDCA col_6 (Bison) and col_105 (Aimfox)"
  targetStore: "Supabase · client_sequencers.api_key"
  design: automation/n8n/workflows/ops/sheets-credential-sync-on-edit/README.md
  notes: >-
    A CREDENTIAL move, not a data migration — ADR-0012 has always placed per-client vendor keys in
    client_sequencers, and migration-backlog cross-cutting §2 carves credentials out of the Sheets
    transition as something that moves sooner and independently. This is the edit-driven half of the
    pair: sheets-bison-credential-sync sweeps every 6 hours and can CREATE a Bison row because it
    reads the client name from the sheet; this one reacts in seconds to a manual edit but only ever
    resolves a client through the emailbison row that already exists.
  reconciliation: >-
    select s.key, count(*) as rows, count(*) filter (where coalesce(cs.api_key,'') <> '') as keyed
    from public.client_sequencers cs
    join public.sequencers s on s.id = cs.sequencer_id group by 1;
    Baseline 2026-07-29 before this workflow existed: emailbison 44/44 keyed, aimfox 7/7 keyed
    (1 with a NULL external_workspace_id).
  parityEvidence: >-
    The statement was proven against production in a rolled-back transaction on 2026-07-29 with a
    three-row synthetic payload covering all four branches — rows_in=3, clients_resolved=2,
    bison_keys_refreshed=2, aimfox_rows_created=1, aimfox_keys_refreshed=1,
    unmatched_workspaces="999999" — and coverage was re-read afterwards to confirm the rollback
    (44/7, unchanged). Three edge payloads ([], blank keys, blank workspace id) each wrote nothing.
    Live: executions 57608/57609 (2026-07-29 06:34 UTC, CS PDCA row 9 / workspace 11) both succeeded
    end to end with clients_resolved=1 and every write counter 0 — the sheet already held what the
    database held, so the IS DISTINCT FROM guard correctly wrote nothing. Confirmed in Postgres: no
    client_sequencers row was created or updated on 2026-07-29. The resolve path is therefore proven
    on real data and the UPDATE / Aimfox INSERT branches are NOT — the next genuine key rotation is
    that proof.

idempotency:
  key: "client_sequencers.external_workspace_id (Bison, update-only); UNIQUE (client_id, sequencer_id) (Aimfox, upsert)"
  notes: >-
    Both writes are guarded by `IS DISTINCT FROM`, so a redelivered webhook — or an edit to an
    unrelated cell in the same row — reports 0 refreshed rather than touching updated_at. The Apps
    Script always sends all three columns, which makes a re-post a self-healing re-sync. Since
    2026-08-03 the Aimfox guard also fires on a changed external_workspace_id: the key-only guard
    meant a row with a current key could never acquire a missing workspace id, which is how FitMech
    kept a valid key and a NULL workspace. Proven in a rolled-back transaction on 2026-08-03 —
    unresolved writes nothing, resolved fills the workspace, a repeat writes nothing, and an
    unresolved call after a resolved one does not blank what is already stored.

retryPolicy:
  notes: >-
    Single statement, no retry. `responseMode: lastNode` is deliberate: a failed write returns a
    non-2xx, and the Apps Script raises so the person editing the sheet sees it instead of a silent
    no-op. settings.errorWorkflow points at automation-failure-recorder, so a failure also becomes
    an integration_sync_runs row.

knownViolations: []
