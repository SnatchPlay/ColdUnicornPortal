schemaVersion: 1

id: bison-workspace-setup
name: "[SETUP] Bison workspace · resolve, key, webhooks, tags"
domain: ops
owner: automation

# `managed` since 2026-08-07: the graph exists as c82kKnHaREUMvPBR and workflow.json is the export.
# The write half landed the same day (iteration 2, 11 nodes -> 21).
#
# The workflow is ACTIVE on the instance and has been since the webhook went live on 2026-08-08 —
# `pnpm n8n:inventory` is the source of truth and reports it as such. This comment claimed INACTIVE
# until 2026-08-19 while README.md line 4 already said `active`; the repository was contradicting
# itself about whether a workflow that mints API keys and creates webhooks was running.
#
# `status` stays `planned` until a real dry_run:false run has been observed end to end.
lifecycle: managed
status: planned
criticality: high         # mints API keys and creates webhooks in a client's sending system

businessProcess:
  - docs/reference/processes/ops/workspace-provisioning.md

architectureDecisions:
  - docs/adr/0012-multi-sequencer-model.md
  - docs/adr/0016-repository-as-automation-source-of-truth.md

triggers:
  - type: executeWorkflowTrigger
    detail: >-
      The entry point. Callable as a sub-workflow so an orchestrator can provision both sequencers
      in one pass.
  - type: webhook
    detail: >-
      POST /webhook/workspace-setup-bison, from the orm-gateway `requestWorkspaceSetup` action.
      UNAUTHENTICATED — see knownViolations. An `Input` node normalises the webhook body and the
      sub-workflow item into one shape and forces dry_run to a boolean.

reads:
  tables:
    - clients
    - sequencers
    - client_sequencers
    # Resolve Client reads the ACTIVE routing rules with their campaigns' statuses. The workflow
    # fills an empty rule and must be able to prove a rule was empty before it writes one.
    - client_ooo_routing
  external:
    - "Bison API · GET /api/workspaces/v1.1 (master key) — resolve a workspace by name; returns data[].{id,name,personal_team,main,parent_id}"
    - "Bison API · GET /api/webhook-url — current webhook set, compared on url + events"
    - "Bison API · GET /api/tags — current tag set, compared on name"
    - "Bison API · GET /api/campaigns — the three OOO automation campaigns, compared on name; the vendor `status` is carried into the report so a draft is not read as a sending campaign"

# Direct table writes — confirmed against RPC_OWNED_TABLES in scripts/n8n/lib/business-rules.mjs.
# None of the four is an ADR-0015 ingestion table, so none of them MUST go through an RPC. That is a
# statement about ownership, not about consequences: see the client_ooo_routing note below for the
# one obligation that comes with writing a routing rule regardless. The two credential-sync workflows
# write client_sequencers the same way.
#
# `campaigns` is a SECOND writer to a table bison-campaign-sync owns, and the split is deliberate:
#   * this workflow seeds the row for a campaign IT created, and only `type` is its business
#     (`ooo_followup` — see the Record node's comment for why the sync cannot be relied on for it);
#   * bison-campaign-sync remains the steady-state owner of `name`, `status`, `database_size` and
#     `positive_responses`, and its ON CONFLICT list does not include `type`, so the two never
#     fight over the same column.
# The write is bounded to the external_ids this run created — never to a campaign it did not make.
# The `seeded` CTE is the one exception and is bounded the other way: a campaign that already
# existed AT THE VENDOR and has no row here gets one with `on conflict do nothing`, never
# `do update`. It exists because a client who is not yet `Active` is skipped by
# bison-campaign-sync's Get Active Clients, so nothing else would ever catalogue those campaigns,
# and the routing editor only offers rows that exist locally.
#
# `client_ooo_routing` is NOT in RPC_OWNED_TABLES (scripts/n8n/lib/business-rules.mjs), so the direct
# insert is sanctioned. It does NOT follow that writing it carries no obligation: the portal's writer
# (updateClientOooRouting) inserts the rule AND THEN calls recover_skipped_ooo_followups, because a
# rule appearing is exactly the event that unparks episodes skipped as routing_missing. An invariant
# that holds for one writer and not the other is not an invariant, so this workflow makes the same
# call — see the `Recover Parked` node, which has to be its own node because rows written by Record's
# `routed` CTE are invisible to that function inside the same statement's snapshot.
#
# The two writers split cleanly: provisioning fills an EMPTY rule at birth (WHERE NOT EXISTS ... AND
# is_active), the portal owns every change after that. This workflow never re-points or deactivates a
# rule an operator set, whatever the campaign's status — that case is reported on steps.routing and
# left for a human, which is precisely what the agency asked for. Nor does it fill a rule from a
# `completed` or `stopped` campaign: an empty rule parks episodes visibly and recoverably, while a
# rule aimed at a dead campaign resolves and drops them (Gbbc's shape — three empty rules and three
# completed campaigns).
writes:
  tables:
    - client_sequencers
    - integration_sync_runs
    - campaigns
    - client_ooo_routing
  tablesWritten:
    - client_sequencers
    - integration_sync_runs
    - campaigns
    - client_ooo_routing
  rpcs:
    - "public.recover_skipped_ooo_followups(client_id, null) (node: Recover Parked) — only when this run actually created a routing rule. Idempotent and self-limiting: it revives only episodes whose routing now resolves, and only for clients with auto_ooo_enabled."
  external:
    - "Bison API · POST /api/workspaces/v1.1/{id}/api-tokens (node: Mint Key) — only when the connector row holds no key. Unlike Aimfox there is no token-list endpoint to fall back on, so storing the result is not a nicety: a minted key that is not written down is lost for good."
    - "Bison API · POST /api/webhook-url (node: Create Missing) — only for a url+events pair that is absent"
    - "Bison API · POST /api/tags (node: Create Missing) — only for a name that is absent, and only preMQL and OOO"
    - "Bison API · POST /api/campaigns (node: Create Missing) — only for an OOO automation campaign absent by name. Body is { name, type: reply_followup } and nothing else, so the campaign is born a DRAFT."
    - "Bison API · POST /api/campaigns/{id}/schedule (node: Create Schedule) — only for a campaign this run created, never for one that already existed: its hours are the client's. Mon-Fri 09:00-17:00 Europe/Warsaw."

# Exactly three nodes issue a POST — Mint Key, Create Missing and Create Schedule — and a dry run
# cannot reach any of them.
# dry_run safety is structural, not a flag inside an HTTP node: Plan Writes returns an EMPTY array on
# a dry run, and n8n does not execute a node with no input items. There is nothing to write with, so
# nothing is written. Create Schedule sits one node further downstream behind the same guard: its
# planner is fed by Collect Creates, which only runs after Plan Writes produced items.
# `dry_run` is read as true for anything except an explicit false — a missing field has to mean
# "do not touch", never "write into a client's system".

# NOT written, deliberately: POST /api/campaigns/v1.1/{id}/sequence-steps.
# The campaign is safe to create; its COPY is not ours to write. All three sequence bodies on the
# old canvas are byte-identical, in feminine Polish, with a hardcoded {PANIEKAMILU}. A manager
# writes the sequence in Bison and starts the campaign; until then it is a draft, and a draft with
# no sequence cannot send a message. See the process document, "The OOO campaign triple".

credentials:
  - alias: "Bison Master"
    type: httpBearerAuth
    usedBy: "List Workspaces, Mint Key"
  - alias: "Postgres account"
    type: postgres
    usedBy: "Resolve Client, Read Claimed, Record, Recover Parked"
  # NOT attached. The Webhook node is unauthenticated as of 2026-08-08 — see knownViolations.
  # The gateway already sends x-automation-secret, so attaching this closes the gap on its own.
  - alias: "Workspace setup webhook auth"
    type: httpHeaderAuth
    planned: true
    usedBy: "Webhook — intended, not attached"

targetContract:
  input: automation/n8n/workflows/ops/bison-workspace-setup/contracts/setup-input.schema.json
  output: automation/n8n/workflows/ops/bison-workspace-setup/contracts/setup-result.schema.json

portalSurfaces:
  - "Clients page — provisioning status column (client_sequencers.setup_state)"
  - "Clients page — OOO column: live/routed rules per client, derived on read from client_ooo_routing + campaigns.status"
  - "Client drawer — Credentials & IDs section: Check (dry_run) / Set up, including the OOO routing step"
  - "Client drawer — OOO routing section: the live truth, and where a broken rule is re-pointed"

metrics: []

idempotency:
  key: >-
    (client_id, sequencer_id) for the connector row; url + events for a webhook; name for a tag;
    (client_id, routing_key) WHERE is_active for a routing rule — the partial unique index
    uq_client_ooo_routing_active, restated as the ON CONFLICT target
  notes: >-
    Every step reads the vendor's current state before it writes and creates only what is absent, so
    a second run is a no-op. Webhooks are matched on url + events and NEVER on name — UniTalk's lead_replied webhook is
    named "Reply Classification" against "Reply classification" everywhere else, and a name match
    would create a duplicate, which means two deliveries per reply, which means two leads.

retryPolicy:
  notes: >-
    No retries. Every vendor call runs with onError continueRegularOutput and contributes its own
    outcome to the `steps` object, so one 4xx yields state `partial` instead of an unexplained stop
    midway. settings.errorWorkflow points at automation-failure-recorder.

cancellation:
  notes: >-
    Nothing to cancel — a single synchronous pass. A failure leaves the workspace partially
    provisioned, which is safe precisely because re-running completes it.

environments:
  development:
    remoteWorkflowId: null
  production:
    remoteWorkflowId: c82kKnHaREUMvPBR

# Read path proven on production 2026-08-07, executions 70463-70467, dry_run only: five clients,
# all resolved by `stored`, all with both webhooks and both tags. It surfaced two defects outside
# its own scope — public.campaigns keeps campaigns the vendor no longer has (bison-campaign-sync is
# INSERT ... ON CONFLICT DO UPDATE with no removal path), and FortumEnergia's client_ooo_routing
# points at GIC's three campaigns. Neither is fixed here; both are recorded in the process document.

# The workflow this one replaces, together with aimfox-workspace-setup.
supersedes:
  - id: 8uRWXHe9FIfglq1u
    name: "My workflow 6"
    note: >-
      Orphan manual canvas, inactive, 23 nodes, both sequencers in one graph. Defects carried into
      this rewrite as fixes: workspace id 13 hardcoded into every Bison URL; Create Campaign
      Sequence1 and Sequence2 both target $('Create "OOO automation | general"'), so male and
      female sequences were written into general three times over; Create Campaign Schedule2
      references $('Create "OOO automation | female"') while the node is named
      'Create "OOO automation | female"1', a dead reference; a node labelled "Add 'MQL' label1"
      actually creates DNC; the minted Bison token is consumed inline from
      data.plain_text_token and never stored in client_sequencers; no idempotency and no error
      handling anywhere.

knownViolations:
  # `rule` is the validator's finding id, not prose — it is what suppresses the warning. The prose
  # belongs in `reason`, and the ADR clause being broken is ADR-0018 §2.
  - rule: unauthenticated-webhook
    reason: >-
      Breaks ADR-0018 §2 ("header-authenticated from its first day"). Explicit owner decision on
      2026-08-08; the header-auth alternative was offered, costed at two minutes in the n8n UI, and
      declined for now. The gateway ALREADY sends x-automation-secret, so attaching a credential
      later is a one-side change that breaks nothing. Mitigation: the run is idempotent and additive
      against a closed canonical set, never deletes, and cannot be pointed at an arbitrary workspace
      — that comes from client_sequencers or an exact name match, never from the request. No
      credential crosses back (the result contract forbids api_key; the gateway strips
      api_key/token/plain_text_token at its boundary). The Input node treats anything but an
      explicit boolean false as a dry run, so a malformed body cannot write.
    trackedIn: docs/reference/n8n/security.md#11-the-workspace-provisioning-webhooks-are-unauthenticated--medium-open
    expires: 2026-11-30
