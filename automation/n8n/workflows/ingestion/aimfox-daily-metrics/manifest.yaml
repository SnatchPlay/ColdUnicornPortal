schemaVersion: 1

id: aimfox-daily-metrics
name: "Get Metrics from Aimfox"
domain: ingestion
owner: automation
lifecycle: managed
status: active
criticality: medium          # drives how much audience the team loads; wrong numbers waste capacity

businessProcess:
  - docs/reference/processes/outreach/linkedin-aimfox.md

architectureDecisions:
  - docs/adr/0012-multi-sequencer-model.md
  - docs/adr/0017-sheets-to-supabase-dual-write-transition.md

triggers:
  - type: schedule
    detail: "every 2 hours"

reads:
  external:
    - "Google Sheets · CS PDCA — active clients (col_7='Active'), Aimfox token (col_105), workspace id (col_5)"
    - "Aimfox API · GET /campaigns, /campaigns/{id}, /campaigns/{id}/metrics"
    - "Aimfox API · GET /accounts, /accounts/{id}/limits"
    - "Aimfox API · GET /analytics/interactions?bucket=1 day"

writes:
  external:
    - "Google Sheets · CS PDCA — 'Remaining database', 'Invitations limit', schedule volumes"
    - "Google Sheets · 🤖Daily stats — today's row for the client"
  tables:
    - sequencer_daily_stats
    - campaigns
  rpcs: []
  tablesWritten:
    - sequencer_daily_stats  # branch S, one row per Aimfox account per day
    - campaigns              # branch S, metrics ONLY (invites_sent / invites_accepted /
                             # message_steps / metrics_synced_at) — UPDATE, never INSERT.
                             # Identity, status and database_size belong to aimfox-campaign-sync;
                             # the two writers share the row on disjoint column sets.

transition:
  phase: A                   # dual-write: branch L to Sheets, branch S to Supabase
  phaseState: live           # branch S published and writing since 2026-07-22
  authoritativeSource: sheets
  legacyStore: "Google Sheets · CS PDCA + 🤖Daily stats"
  targetStore: "Supabase · sequencer_daily_stats"
  design: docs/reference/processes/outreach/linkedin-aimfox.md
  notes: >-
    The safest phase-A candidate in the whole Aimfox family: a pure UPSERT of derived numbers that
    touches no person and calls no write endpoint. Branch S is fully parallel — it hangs off the
    schedule trigger, resolves clients from client_sequencers and makes its OWN Aimfox calls with
    client_sequencers.api_key, so branch L can be disconnected in one move (ADR-0017 §1a). It fixes
    rather than ports four defects of branch L: the double-subtracted remaining limit, profile_id
    taken from a spreadsheet row number, the averaging of account and workspace identifiers, and the
    first-bucket artefact in the interactions series. It writes nothing when a client has zero
    accounts, or more than one — see knownRisks in the README.

    2026-08-19: branch S also stores the per-campaign numbers it was already fetching and throwing
    away — invites sent, invites accepted, and the count of message templates that says whether a
    campaign only invites or runs a full sequence. Same pass, no extra vendor calls. The same change
    fixed remaining-database to subtract from `target_count` (the loaded audience) instead of
    `audience_size`, a fixed vendor ceiling — 10000 for every `list` campaign — which had it reading
    roughly twenty times too high.
  reconciliation: >-
    Per report_date compare the PDCA cells against the sequencer_daily_stats rows for the same
    client, summing across profile_id and EXCLUDING profile_id = '__workspace_total__' (those are the
    2026-07-22 sheet backfill's rollup rows and would double every overlapping day).
    Expect branch S to disagree with the sheet on remaining limit: branch L double-subtracts.
  parityEvidence: >-
    execution 50246 (2026-07-22): 4 of 5 aimfox clients written, one row each, profile_id = the real
    Aimfox account id. FitMech skipped with an explicit reason (no LinkedIn account connected).
    A dry-run variant of the same SQL was run first (execution 50244) and predicted the same 4 rows.

idempotency:
  key: "sheet row matched on row_number; a re-run overwrites the same cells with fresher values"
  notes: >-
    Idempotent by overwrite, NOT by key. Matching on row_number is positional: inserting, deleting or
    sorting a CS PDCA row between the read and the update writes one client's capacity onto another
    client's row, silently. A keyed match (client id) would remove the hazard.

retryPolicy:
  notes: >-
    Branch L has none — no retry, no error branch. A failed API call leaves the sheets partially
    updated for that client and the run reports success for the others. Every branch S node is
    onError=continueRegularOutput so a Supabase or Aimfox failure cannot stop branch L
    (ADR-0017: Supabase failure is non-fatal in phase A), and settings.errorWorkflow now points at
    automation-failure-recorder.

knownViolations: []
