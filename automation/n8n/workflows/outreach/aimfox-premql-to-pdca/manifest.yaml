schemaVersion: 1

id: aimfox-premql-to-pdca
name: "preMQL tag added (Aimfox) -> Add lead to PDCA"
domain: outreach
owner: automation
lifecycle: managed
status: active
criticality: high            # creates leads — the LinkedIn entry point into the funnel

businessProcess:
  - docs/reference/processes/outreach/linkedin-aimfox.md

architectureDecisions:
  - docs/adr/0012-multi-sequencer-model.md
  - docs/adr/0015-sequencer-contacts-and-ooo-followups.md
  - docs/adr/0004-lead-state-boundaries.md
  - docs/adr/0017-sheets-to-supabase-dual-write-transition.md

triggers:
  - type: webhook
    detail: "POST /webhook/preMQL-Aimfox — no authentication (security.md §3)"

reads:
  tables:
    - client_sequencers      # the client's Aimfox token — replaces the broken minting endpoint
    - sequencers
    - campaigns              # [S] Resolve campaign — external_id = lead.origins[0].id
  external:
    - "Aimfox API · GET /leads/{id}, /accounts/{id}/leads/{id}/conversation, /accounts/{id}/conversations/{urn} (branch L AND branch S each make their own calls)"
    - "Google Sheets · CS PDCA — client row: sheet id (col_4)"
    - "Google Sheets · <client>/Leads — does this lead already exist?"
    - "Lusha · POST /v3/contacts/search-and-enrich — branch S only since 2026-08-18; branch L's node is disabled"
    - "OpenAI · POST /v1/responses (gpt-5-mini) — which current-experience company does the reply mention?"

writes:
  external:
    - "Google Sheets · <client>/Leads — appends a lead row (sheets batchUpdate), or updates the existing one"
    - "UniTalk · POST /api/message/send — notification"
    - "Aimfox · POST /v2/blacklist/{lead.urn} — the converted contact is removed from further outreach"
    - "Aimfox · POST /v2/blacklist-companies — the contact's company is removed from further outreach"
  tables:
    - sequencer_contacts     # via upsert_sequencer_contact RPC
    - replies                # via upsert_reply RPC
    - leads                  # via promote_contact_to_lead RPC
  rpcs:
    - upsert_sequencer_contact
    - upsert_reply
    - promote_contact_to_lead
  tablesWritten:
    - sequencer_contacts
    - replies
    - leads

credentials:
  - alias: "Postgres account"
    type: postgres
    usedBy: "Get Workspace Api Key, [S] upsert_sequencer_contact, [S] upsert_reply, [S] Resolve campaign, [S] promote_contact_to_lead"
  - alias: "Google Sheets account"
    type: googleSheetsOAuth2Api
    usedBy: "[2] Find workspace in CS PDCA, [4] Check if lead already in Leads sheet, Update row in sheet, Create Record, Get Table ID"
  - alias: "Lusha"
    type: httpHeaderAuth
    usedBy: "[S] Lusha Enrichment — the branch-L node of the same name still holds the credential but is DISABLED since 2026-08-18"
  - alias: "UniTalk"
    type: httpHeaderAuth
    usedBy: "HTTP Request (notification)"
  - alias: "OpenAi account"
    type: openAiApi
    usedBy: "OpenAI - Search for the company name"   # predefinedCredentialType — no literal key (security.md §8)

transition:
  phase: A
  phaseState: live
  authoritativeSource: sheets
  legacyStore: "Google Sheets · the client's own Leads tab"
  targetStore: "Supabase · sequencer_contacts + leads (sequencer_id = aimfox)"
  design: docs/reference/n8n/aimfox-phase-a.md
  notes: >-
    Branch S 2026-07-22: its own GET lead info Aimfox / Search Conversations / Get Conversation calls
    (never branch L's), hung off the already-Supabase-only Get Workspace Api Key node — the same
    shared-infra pattern aimfox-classification uses. upsert_sequencer_contact -> upsert_reply
    (classification hardcoded 'Interested', message text from its own conversation fetch) -> Resolve
    campaign -> promote_contact_to_lead. Campaign attribution (task B) turned out to be resolvable
    here: the lead profile response's `lead.origins[0].id` is the same Aimfox campaign UUID
    aimfox-campaign-sync catalogs (verified against a real execution — same id and name appeared in
    both), so campaign_id is populated, not NULL.

    2026-08-18 — PHONE ADDED, and the old note that used to sit here ("no Lusha/phone duplication in
    branch S; phone_number stays NULL rather than doubling vendor cost") no longer applies: there is
    no duplication to avoid, because branch L's Lusha node is now disabled. `[S] Lusha Enrichment`
    runs between [S] Resolve campaign and the RPC, and phone_number + phone_source go through
    promote_contact_to_lead. One Lusha call per lead, on the side that survives the Sheets shutdown.

    Found while wiring it, and worth knowing before anyone "restores" the old node: branch L's Lusha
    call NEVER WORKED. It left `fullResponse` off while its only consumer, `Edit Fields`, read
    `$json.body.results[0].location.country` — a path that only exists when fullResponse is on. So
    `lushaCountry` was always undefined and country always came from the Aimfox fallback. The credits
    were spent and the result was discarded. The branch-S node sets fullResponse, so its phone does
    resolve.

    Country therefore stays where it already was — derived from `lead.location.name` — because that is
    what branch L effectively produced too. Only `phones` is revealed; branch L also asked for
    `emails`, which branch S takes from Aimfox, and Lusha bills per revealed datapoint. onError is set
    because credits are exhausted (defect B4): a 402 must cost the phone, never the lead.

    Verified in a rolled-back transaction on a real unpromoted Aimfox Interested reply: created=true,
    phone_number='+48 987 654 321', phone_source='Lusha', with country and linkedin_url unaffected.
    2026-08-05: branch S now also sends what the run already fetched and was dropping — linkedin_url
    and country to promote_contact_to_lead, message_subject and sequence_step to upsert_reply, and the
    contact's identity taken from the Aimfox profile instead of the webhook body (whose email is always
    null). No migration, no new vendor call. The email expression is shared by the contact node and the
    lead payload on purpose: promote_contact_to_lead check (7) raises when the two disagree. INSERT-only
    — the 60 leads written before this keep their NULLs.
  reconciliation: >-
    At phase A: one `leads` row per appended sheet row, matched on (client, Aimfox lead id), with
    leads.sequencer_id = the aimfox sequencer. Compare row counts per client per day. Qualification is
    synced as of 2026-07-23: branch S passes qualificationFromLabels(lead.labels) into
    promote_contact_to_lead (mql|interested -> MQL, premql|pre-mql -> preMQL), upgrade-only. Compare
    on qualification too.
  parityEvidence: null

idempotency:
  key: "'[4] Check if lead already in Leads sheet' — existing row is updated instead of appended"
  notes: >-
    Guarded by a sheet lookup rather than a constraint, so it is a read-then-write race: two webhooks
    for the same lead can both see 'not found'. The Supabase side has the real guarantee —
    uq_leads_source_sequencer_contact (ADR-0015 §4).

retryPolicy:
  notes: >-
    Mostly none. No retry and no error branch on the Aimfox, Lusha, Sheets or UniTalk calls; a failure
    part way through leaves the lead half-written and the notification unsent. The 2026-08-05
    blacklist chain sets retryOnFail on `Add company to blacklist` / `Add company to blacklist1` /
    `OpenAI - Search for the company name`, but NOT on `Add Lead to Blacklist` — and none of the four
    has an error output, so a 4xx there fails the whole execution. It runs last (branch L is first in
    the connection order and completes before it), so the sheet write and the notification are already
    done when it fails: ADR-0017 §1 ordering holds.

knownViolations: []
