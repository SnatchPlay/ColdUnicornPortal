schemaVersion: 1

id: aimfox-import-to-connection-shadow
name: "Aimfox AutoConnect import · Supabase"
domain: outreach
owner: automation
lifecycle: managed

# Shadow on 2026-08-09, primary on 2026-08-10: the send limb landed and the schedule was switched
# on, and `aimfox-import-to-connection` (the Sheets branch) was deactivated in the same sitting.
status: active
criticality: high            # POSTs to a campaign audience — queues real LinkedIn invites

businessProcess:
  - docs/reference/processes/outreach/linkedin-aimfox.md

architectureDecisions:
  - docs/adr/0012-multi-sequencer-model.md
  - docs/adr/0017-sheets-to-supabase-dual-write-transition.md

triggers:
  - type: schedule
    detail: "daily at 19:00 — the ONLY caller that produces dry_run=false, i.e. the only one that sends"
  - type: webhook
    detail: >-
      POST /webhook/autoconnect-import. Runs the selection and returns what it WOULD send. It can
      never send: `Input` forces dry_run true for every webhook call regardless of body.
  - type: executeWorkflowTrigger
    detail: "By hand. n8n-authenticated, so it may pass dry_run:false explicitly."

reads:
  tables:
    - clients
    - client_sequencers
    - sequencers
    - leads
  external:
    - "Aimfox API · GET /api/v2/campaigns — is there an ACTIVE campaign named AutoConnect? Matched across the whole list, never by position"

# Direct table write, no RPC — checked against RPC_OWNED_TABLES in
# scripts/n8n/lib/business-rules.mjs. The ingestion RPC contract of ADR-0015 covers leads, replies,
# ooo_followups and sequencer_contacts; integration_sync_runs is none of them and carries no
# business invariant an RPC would be protecting. Every other workflow that records a run writes it
# the same way.
writes:
  tables:
    - integration_sync_runs
  tablesWritten:
    - integration_sync_runs
  rpcs:
    - "public.mark_linkedin_invited(uuid[]) — stamps leads.linkedin_invitation_sent_at (migration 20260810)"
  external:
    - "Aimfox API · POST /api/v2/campaigns/{id}/audience (node: Add To Audience) — REAL SIDE EFFECT: queues a LinkedIn connection request"


# One node reaches the vendor's audience endpoint — `Add To Audience`, and it queues a real LinkedIn
# connection request. It sits behind `Has Imports?`, and `Plan Imports` returns an EMPTY array on a
# dry run: a node with no input items does not execute, so not sending is structural rather than a
# flag inside the HTTP node. Only the Schedule trigger produces dry_run=false.

transition:
  phase: C
  phaseState: cutover
  authoritativeSource: supabase
  legacyStore: "Google Sheets · CS PDCA + the client's Leads tab"
  targetStore: "Supabase · leads + client_sequencers"
  design: docs/reference/processes/outreach/linkedin-aimfox.md
  notes: >-
    Branch S of aimfox-import-to-connection. Its own manifest called for exactly this treatment —
    "build the request, log it, measure agreement, only then send" — on the grounds that a second
    branch would send a second set of invites to a real person. That grounds no longer holds: branch
    L was measured on 2026-08-09 importing for 0 of 9 clients, because no workspace has a campaign
    named AutoConnect. What survives is the reason that matters — nobody has ever seen how many
    invites this selection produces, and every row is a connection request to a person.
  reconciliation: >-
    No longer a comparison: branch L is deactivated and this is the only importer. What replaces it
    is the audit row — `would_send`, `sent`, `failed` and `blocked` per run in integration_sync_runs
    (sync_type autoconnect_import), which branch L never produced at all.
  parityEvidence: >-
    Measured on production 2026-08-10 before the cutover, through the read-only webhook: 7 clients
    hold an Aimfox key, 2 resolve, 5 blocked with "no AutoConnect campaign". Volume over the same
    predicate: 0 for the previous day, 5 over 7 days, 36 over 30, 178 over 120 (ColdUnicorn PL and
    Audytel). Small enough that the cutover could not produce a burst.

idempotency:
  key: "n8n_execution_id on the audit row (ON CONFLICT DO NOTHING); the selection itself is a pure read"
  notes: >-
    Re-running produces the same plan for the same window and one audit row per execution. When the
    send limb is added, `leads.linkedin_invitation_sent_at` becomes the real key — it exists, nothing
    writes it today, and branch L has no local dedup at all (its defect 5).

retryPolicy:
  notes: >-
    None needed. Every node is a read except the audit insert, which runs with onError
    continueRegularOutput so a failed insert still yields a result the caller can read.

cancellation:
  notes: "Nothing to cancel — a single synchronous pass with no external side effect."

environments:
  development:
    remoteWorkflowId: null
  production:
    remoteWorkflowId: null

knownViolations:
  - rule: unauthenticated-webhook
    reason: >-
      The webhook exists to run the selection on demand and read the numbers; the schedule is what
      sends. It carries no auth, matching the provisioning webhooks (owner decision, 2026-08-08).
      The mitigation here is stronger than theirs and it is structural, not a policy: `Input` forces
      dry_run TRUE for every webhook call regardless of body, so there is no request that makes this
      path queue a LinkedIn invite. A caller who learns the path can trigger a read and an audit row,
      nothing else.
    trackedIn: docs/reference/n8n/security.md#11-the-workspace-provisioning-webhooks-are-unauthenticated--medium-open
    expires: 2026-11-30
