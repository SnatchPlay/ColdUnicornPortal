schemaVersion: 1

id: ooo-remove-on-tag-removed
name: "[child-7] TAG_REMOVED · OOO · Remove from OOO Leads"
domain: outreach
owner: automation
lifecycle: managed
status: active
criticality: medium

businessProcess:
  - docs/reference/processes/outreach/ooo-followups.md

architectureDecisions:
  - docs/adr/0015-sequencer-contacts-and-ooo-followups.md
  - docs/adr/0017-sheets-to-supabase-dual-write-transition.md

triggers:
  - type: sub-workflow
    calledBy: "[HUB] Bison Replies Dispatcher (xPzdtWQiY3lGtqI1)"
    event: TAG_REMOVED
    tag: OOO

reads:
  external:
    - "Google Sheets · CS PDCA (workspace → Bison API key)"
    - "Bison API · GET /leads/{taggable_id}"

writes:
  external:
    - "Google Sheets · OOO Leads — DELETE the row"
  tables: []
  rpcs:
    - cancel_active_ooo_followup

transition:
  phase: A
  phaseState: live              # published 2026-07-21; branch S runs on every OOO TAG_REMOVED
  authoritativeSource: sheets
  targetStore: "Supabase · ooo_followups"
  design: docs/reference/n8n/ooo-phase-a.md
  notes: >-
    SEMANTIC GAP, not a mapping detail: the sheet DELETES the row, cancel_active_ooo_followup
    CANCELS and keeps the episode. ADR-0015 keeps history so a past absence stays explainable.
    Reconciliation must compare ACTIVE rows only, or every cancellation reads as divergence.
  ordering: >-
    DECLARED "sheets first, supabase second". WHAT ACTUALLY RUNS, since an unknown date before
    2026-08-26: branch S only. The trigger edge into "[86] Find workspace in CS PDCA" is absent from
    the live graph, so all four branch-L nodes are unreachable and nothing writes or deletes the
    OOO Leads sheet. That makes `authoritativeSource: sheets` above untrue as written. It is left
    standing rather than quietly corrected, because the correction is a decision: either this was a
    deliberate follow-through of the 2026-08-19 branch-L-off decision on ooo-detect-and-log — in
    which case the phase moves to C and ADR-0017 §5 wants go-live evidence recorded — or the edge
    came out by accident and belongs back. See defect-backlog F1 and the README.
  reconciliation: null
  parityEvidence: null

idempotency:
  key: "sheet row lookup by lead — deleting an absent row is a no-op"

retryPolicy:
  notes: "None."
