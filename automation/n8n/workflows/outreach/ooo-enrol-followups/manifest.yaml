schemaVersion: 1

id: ooo-enrol-followups
name: "Add OOO Leads"
domain: outreach
owner: automation
lifecycle: managed
status: active
criticality: high            # the ONLY OOO workflow that calls a Bison write endpoint

businessProcess:
  - docs/reference/processes/outreach/ooo-followups.md

architectureDecisions:
  - docs/adr/0015-sequencer-contacts-and-ooo-followups.md
  - docs/adr/0017-sheets-to-supabase-dual-write-transition.md

triggers:
  - type: schedule
    detail: "daily at 09:00"

reads:
  external:
    - "Google Sheets · OOO Leads — rows due today"
    - "Google Sheets · ARM — (bison workspace id, gender) → bison ooo campaign id"
    - "Google Sheets · CS PDCA — per-workspace Bison API key (col_5 → col_6)"

writes:
  external:
    - "Bison API · POST /campaigns/{campaignId}/leads/attach-leads  ← REAL SIDE EFFECT"
  tables: []
  rpcs: []                     # A1 is read-only: no claim, no state transition
  tablesWritten:
    - integration_sync_runs    # shadow log only (provider=bison, sync_type=ooo_enrol_shadow)

transition:
  phase: A1                     # SHADOW: branch S records intent, sends nothing
  phaseState: live              # published 2026-07-21
  authoritativeSource: sheets
  legacyStore: "Google Sheets · OOO Leads + ARM"
  targetStore: "Supabase · ooo_followups + client_ooo_routing"
  design: docs/reference/n8n/ooo-phase-a.md
  notes: >-
    The only workflow in the family needing the A1 shadow step: two branches resolving DIFFERENT
    campaigns would enrol one contact into two follow-up sequences. Same campaign is a safe no-op —
    Bison ignores a lead already in the campaign (ADR-0015 §4).
  reconciliation: >-
    Per scheduled run, compare branch S's intent against branch L's actual attach calls:
      select metadata->'intended_attach', metadata->>'due_count', metadata->>'unrouted_count'
      from public.integration_sync_runs
      where provider = 'bison' and sync_type = 'ooo_enrol_shadow'
      order by started_at desc;
    A1 -> A2 requires the (bison_lead_id, bison_campaign_id) sets to agree, EXCLUDING workspaces
    75 and 130 (knowingly unrouted) and excluding rows branch L missed because its due filter is
    an exact equality — branch S catching those up is correct, not a divergence.
  parityEvidence: null

idempotency:
  key: "bison attach-leads is a no-op for a lead already in the campaign (ADR-0015 §4)"
  notes: >-
    Safe on re-run for the SAME campaign only. Re-running with a different resolved campaign
    double-enrols the contact. There is no local dedup.

retryPolicy:
  notes: >-
    None. No retry and no error branch on the attach call, so a failed enrolment is lost with no
    trace beyond the n8n execution list. Branch S fixes this by recording the outcome via
    mark_ooo_submitted / mark_ooo_failed.
